name: Build Hosting.com release

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload the verified build to Hosting.com's non-public release directory
        required: true
        type: boolean
        default: false
      inspect_hosting:
        description: Inspect Hosting.com directories without changing the public site
        required: true
        type: boolean
        default: false
      activate_release:
        description: Atomically switch the verified Hosting.com release into the public directory
        required: true
        type: boolean
        default: false
      release_sha:
        description: Commit SHA of the verified release to activate
        required: false
        type: string
        default: ""
      hosting_host:
        description: Hosting server to inspect, upload to, or activate
        required: true
        type: string
        default: s20849.use2.stableserver.net

permissions:
  contents: read

concurrency:
  group: versatile-edge-hosting-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: versatile-edge-static-site
          path: dist/client
          include-hidden-files: true
          if-no-files-found: error

  upload-release:
    needs: build
    if: inputs.upload_release
    runs-on: ubuntu-24.04
    environment: hosting-release
    env:
      HOSTING_HOST: ${{ inputs.hosting_host }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: versatile-edge-static-site
          path: dist/client
      - name: Configure restricted Hosting.com SSH access
        env:
          HOSTING_SSH_KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTING_SSH_KEY" > ~/.ssh/hosting_deploy
          chmod 600 ~/.ssh/hosting_deploy
          ssh-keyscan -H "$HOSTING_HOST" >> ~/.ssh/known_hosts
      - name: Upload non-public release
        run: |
          release_path="releases/versatile-edge/${GITHUB_SHA}"
          ssh -i ~/.ssh/hosting_deploy "versatil@$HOSTING_HOST" "mkdir -p '$release_path'"
          rsync -a --delete -e "ssh -i ~/.ssh/hosting_deploy" dist/client/ "versatil@$HOSTING_HOST:$release_path/"
          ssh -i ~/.ssh/hosting_deploy "versatil@$HOSTING_HOST" "test -s '$release_path/index.html' && test -s '$release_path/.htaccess' && test -s '$release_path/api/inquiries.php'"
      - name: Activate the uploaded release with rollback preserved
        if: inputs.activate_release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/hosting_deploy "versatil@$HOSTING_HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
            set -euo pipefail
            release_path="/home/versatil/releases/versatile-edge/${RELEASE_SHA}"
            test -s "${release_path}/index.html"
            test -s "${release_path}/.htaccess"
            test -s "${release_path}/api/inquiries.php"
            test -d /home/versatil/public_html
            backup_path="/home/versatil/public_html.rollback-$(date +%Y%m%d%H%M%S)"
            ln -s "${release_path}" /home/versatil/public_html.next
            mv /home/versatil/public_html "${backup_path}"
            mv /home/versatil/public_html.next /home/versatil/public_html
            test -s /home/versatil/public_html/index.html
            printf 'Activated %s; rollback retained at %s\n' "${release_path}" "${backup_path}"
          REMOTE

  inspect-hosting:
    if: inputs.inspect_hosting
    runs-on: ubuntu-24.04
    environment: hosting-release
    env:
      HOSTING_HOST: ${{ inputs.hosting_host }}
    steps:
      - name: Configure restricted Hosting.com SSH access
        env:
          HOSTING_SSH_KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTING_SSH_KEY" > ~/.ssh/hosting_deploy
          chmod 600 ~/.ssh/hosting_deploy
          ssh-keyscan -H "$HOSTING_HOST" >> ~/.ssh/known_hosts
      - name: Inspect release and public directories
        run: |
          ssh -i ~/.ssh/hosting_deploy "versatil@$HOSTING_HOST" '
            pwd
            ls -ld ./public_html
            readlink -f ./public_html
            test -s ./public_html/renovation-talk.html && echo "renovation-talk.html present"
            test -s ./public_html/renovation-talk/why-renovations-cost-more-per-square-foot-than-new-construction.html && echo "article HTML present"
            find . -maxdepth 3 -type d \( -name public_html -o -name htdocs -o -name www -o -path "./releases/versatile-edge/*" \) -print | sort
            find . -maxdepth 3 -type f -name index.html -print | sort
          '

  activate-release:
    if: inputs.activate_release && !inputs.upload_release && inputs.release_sha != ''
    runs-on: ubuntu-24.04
    environment: hosting-release
    env:
      HOSTING_HOST: ${{ inputs.hosting_host }}
    steps:
      - name: Configure restricted Hosting.com SSH access
        env:
          HOSTING_SSH_KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTING_SSH_KEY" > ~/.ssh/hosting_deploy
          chmod 600 ~/.ssh/hosting_deploy
          ssh-keyscan -H "$HOSTING_HOST" >> ~/.ssh/known_hosts
      - name: Activate verified public release with rollback preserved
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          ssh -i ~/.ssh/hosting_deploy "versatil@$HOSTING_HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
            set -euo pipefail
            release_path="/home/versatil/releases/versatile-edge/${RELEASE_SHA}"
            test -s "${release_path}/index.html"
            test -s "${release_path}/.htaccess"
            test -s "${release_path}/api/inquiries.php"
            test -d /home/versatil/public_html
            backup_path="/home/versatil/public_html.rollback-$(date +%Y%m%d%H%M%S)"
            ln -s "${release_path}" /home/versatil/public_html.next
            mv /home/versatil/public_html "${backup_path}"
            mv /home/versatil/public_html.next /home/versatil/public_html
            test -s /home/versatil/public_html/index.html
            printf 'Activated %s; rollback retained at %s\n' "${release_path}" "${backup_path}"
          REMOTE
