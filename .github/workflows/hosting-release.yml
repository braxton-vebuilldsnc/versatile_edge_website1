name: Build Hosting.com release

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload the verified build to Hosting.com's non-public release directory
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: versatile-edge-hosting-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: versatile-edge-static-site
          path: dist/client
          include-hidden-files: true
          if-no-files-found: error

  upload-release:
    needs: build
    if: inputs.upload_release
    runs-on: ubuntu-24.04
    environment: hosting-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: versatile-edge-static-site
          path: dist/client
      - name: Configure restricted Hosting.com SSH access
        env:
          HOSTING_SSH_KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTING_SSH_KEY" > ~/.ssh/hosting_deploy
          chmod 600 ~/.ssh/hosting_deploy
          ssh-keyscan -H s20849.use2.stableserver.net >> ~/.ssh/known_hosts
      - name: Upload non-public release
        run: |
          release_path="releases/versatile-edge/${GITHUB_SHA}"
          ssh -i ~/.ssh/hosting_deploy versatil@s20849.use2.stableserver.net "mkdir -p '$release_path'"
          rsync -a --delete -e 'ssh -i ~/.ssh/hosting_deploy' dist/client/ "versatil@s20849.use2.stableserver.net:$release_path/"
          ssh -i ~/.ssh/hosting_deploy versatil@s20849.use2.stableserver.net "test -s '$release_path/index.html' && test -s '$release_path/.htaccess' && test -s '$release_path/api/inquiries.php'"
